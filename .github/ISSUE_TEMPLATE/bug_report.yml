name: Bug report
description: Report a reproducible problem in OpenVocaly
title: 'bug: '
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please include enough detail so the issue can be reproduced.

  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the actual behavior and why it is a problem.
      placeholder: After pressing the dictation shortcut, recording starts but no transcript is inserted.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
      placeholder: Recording should transcribe and insert text into the active app.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Provide exact steps from a clean app launch if possible.
      placeholder: |
        1. Launch OpenVocaly
        2. Focus a text field in App X
        3. Press shortcut Y
        4. Speak sentence Z
        5. Observe ...
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Paste relevant logs or screenshots if available.
      render: shell

  - type: input
    id: app_version
    attributes:
      label: App version or commit
      placeholder: v1.0.0 or commit hash
    validations:
      required: false

  - type: input
    id: os
    attributes:
      label: OS version
      placeholder: macOS 14.6
    validations:
      required: true

  - type: textarea
    id: notes
    attributes:
      label: Additional context
      description: Include hardware details, microphone setup, or anything else that may matter.
