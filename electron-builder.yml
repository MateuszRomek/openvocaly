appId: com.openvocally.app
productName: OpenVocaly
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!.agents'
  - '!.agents/**'
  - '!.git'
  - '!.git/**'
  - '!dist'
  - '!dist/**'
  - '!native/macos-asr-host/.build'
  - '!native/macos-asr-host/.build/**'
  - '!native/ptt-hook-macos/build'
  - '!native/ptt-hook-macos/build/**'
  - '!native/ptt-hook-macos/bin'
  - '!native/ptt-hook-macos/bin/**'
  - '!**/__pycache__'
  - '!**/__pycache__/**'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
asarUnpack:
  - resources/bin/**
  - resources/**
  - resources/qwen-mlx-host/**
  - node_modules/ffmpeg-static/**/*
  - node_modules/@openvocaly/ptt-hook-macos/build/**/*.node
win:
  executableName: openvocaly
  files:
    - '!resources/bin/*darwin*'
    - '!resources/bin/*linux*'
    - '!resources/bin/*.dylib'
    - '!resources/bin/*.so'
    - '!resources/bin/*.so.*'
    - '!resources/bin/macos-fast-paste'
    - '!resources/bin/macos-asr-host'
    - '!resources/qwen-mlx-host/**'
    - '!resources/bin/FluidAudio_FluidAudio.bundle/**'
nsis:
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
mac:
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    - NSCameraUsageDescription: Application requests access to the device's camera.
    - NSMicrophoneUsageDescription: Application requests access to the device's microphone.
    - NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
    - NSDownloadsFolderUsageDescription: Application requests access to the user's Downloads folder.
  files:
    - '!src'
    - '!src/**'
    - '!.agents'
    - '!.agents/**'
    - '!.git'
    - '!.git/**'
    - '!dist'
    - '!dist/**'
    - '!native/macos-asr-host/.build'
    - '!native/macos-asr-host/.build/**'
    - '!native/ptt-hook-macos/build'
    - '!native/ptt-hook-macos/build/**'
    - '!native/ptt-hook-macos/bin'
    - '!native/ptt-hook-macos/bin/**'
    - '!**/__pycache__'
    - '!**/__pycache__/**'
    - '!resources/bin/*win32*'
    - '!resources/bin/*linux*'
    - '!resources/bin/*.dll'
    - '!resources/bin/*.so'
    - '!resources/bin/*.so.*'
  notarize: false
dmg:
  artifactName: ${name}-${version}.${ext}
linux:
  target:
    - AppImage
    - snap
    - deb
  maintainer: electronjs.org
  category: Utility
  files:
    - '!resources/bin/*darwin*'
    - '!resources/bin/*win32*'
    - '!resources/bin/*.dylib'
    - '!resources/bin/*.dll'
    - '!resources/bin/macos-fast-paste'
    - '!resources/bin/macos-asr-host'
    - '!resources/qwen-mlx-host/**'
    - '!resources/bin/FluidAudio_FluidAudio.bundle/**'
appImage:
  artifactName: ${name}-${version}.${ext}
npmRebuild: false
