appId: com.openvocally.app
productName: OpenVocaly
directories:
  buildResources: build
files:
  - out/**
  - resources/**
  - '!resources/macos-fast-paste.swift'
  - '!**/__pycache__/**'
asarUnpack:
  - resources/**
  - node_modules/ffmpeg-static/**/*
  - node_modules/@openvocaly/ptt-hook-macos/build/**/*.node
mac:
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  signIgnore:
    - 'resources/qwen-mlx-host/_internal/Python\.framework'
    - 'resources/bin/FluidAudio_FluidAudio\.bundle'
  hardenedRuntime: false
  target:
    - target: dmg
      arch: arm64
    - target: zip
      arch: arm64
  extendInfo:
    - NSMicrophoneUsageDescription: OpenVocaly listens while you hold the dictation shortcut and transcribes the audio on this Mac.
  notarize: false
dmg:
  artifactName: ${name}-${version}.${ext}
npmRebuild: false
